openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: monitoring
    description: Public news and global event monitoring
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /monitoring/briefing:
    get:
      operationId: getMonitoringBriefing
      tags: [monitoring]
      summary: Get the current public-source monitoring briefing
      description: Returns recent headlines, geolocated public events, and source availability from public feeds.
      parameters:
        - name: q
          in: query
          required: false
          description: Optional text filter applied to headlines and events.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of headlines and events to return.
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 40
      responses:
        "200":
          description: Current monitoring briefing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringBriefing"
  /monitoring/cameras:
    get:
      operationId: getMonitoringCameras
      tags: [monitoring]
      summary: List public camera catalogue records
      description: >-
        Returns bounded public camera catalogue records and per-provider catalogue
        health. Individual camera feeds are never probed or proxied; feedStatus and
        feedReachability are always "not-probed".
      parameters:
        - name: q
          in: query
          required: false
          description: Optional text filter applied to catalogue metadata.
          schema:
            type: string
        - name: country
          in: query
          required: false
          description: Country name or ISO-3166 alpha-2 code filter.
          schema:
            type: string
        - name: provider
          in: query
          required: false
          description: Provider id filter, e.g. qld-tmr.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of camera records to return.
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 100
      responses:
        "200":
          description: Bounded camera catalogue records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringCameras"
  /monitoring/maritime:
    get:
      operationId: getMonitoringMaritime
      tags: [monitoring]
      summary: List vessel positions from free, openly licensed regional AIS sources
      description: >-
        Returns bounded vessel positions aggregated server-side from openly licensed
        regional AIS providers, plus per-provider health and explicit coverage
        metadata. Coverage is REGIONAL, not global: absence of vessels outside the
        declared regions means Signalwatch has no maritime source there, not that no
        vessels are present. Every record carries the provider that supplied it, the
        provider licence, and both the provider position timestamp (when supplied) and
        the Signalwatch receipt time; the two are never conflated.
      parameters:
        - name: q
          in: query
          required: false
          description: Optional text filter applied to vessel name, callsign, MMSI, IMO and destination.
          schema:
            type: string
        - name: provider
          in: query
          required: false
          description: Provider id filter, e.g. digitraffic.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of vessel records to return.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 400
      responses:
        "200":
          description: Bounded vessel positions with coverage and provider health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringVessels"
  /monitoring/hazards:
    get:
      operationId: getMonitoringHazards
      tags: [monitoring]
      summary: List natural hazard observations from free, openly licensed hazard sources
      description: >-
        Returns bounded natural hazard observations aggregated server-side from
        hazard-oriented public data sources (USGS earthquakes, NASA EONET events),
        plus per-source health, licensing and explicit coverage metadata. Records are
        structured observations published by hazard sources; nothing here is derived
        from news headlines, and a hazard type is never inferred from wording. The
        source observation time and the Signalwatch receipt time are always kept
        distinct. One source failing marks that source unavailable and never empties
        the layer. Upstream feeds are shared with the briefing route, so this endpoint
        adds no additional polling of the providers.
      parameters:
        - name: q
          in: query
          required: false
          description: Optional text filter applied to hazard title, type, place and source.
          schema:
            type: string
        - name: source
          in: query
          required: false
          description: Source id filter, e.g. usgs or nasa-eonet.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of hazard records to return.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 250
      responses:
        "200":
          description: Bounded hazard observations with coverage and source health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringHazards"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MonitoringBriefing:
      type: object
      required:
        - generatedAt
        - headlineCount
        - eventCount
        - sourcesOnline
        - headlines
        - events
        - sources
      properties:
        generatedAt:
          type: string
          format: date-time
        headlineCount:
          type: integer
        eventCount:
          type: integer
        sourcesOnline:
          type: integer
        headlines:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringHeadline"
        events:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringEvent"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringSource"
    MonitoringCameras:
      type: object
      required:
        - generatedAt
        - matchedCount
        - returnedCount
        - limit
        - providers
        - cameras
      properties:
        generatedAt:
          type: string
          format: date-time
        matchedCount:
          type: integer
        returnedCount:
          type: integer
        limit:
          type: integer
        providers:
          type: array
          items:
            $ref: "#/components/schemas/CameraProviderStatus"
        cameras:
          type: array
          items:
            $ref: "#/components/schemas/CameraRecord"
    MonitoringVessels:
      type: object
      required:
        - generatedAt
        - matchedCount
        - returnedCount
        - limit
        - coverage
        - providers
        - vessels
      properties:
        generatedAt:
          type: string
          format: date-time
        matchedCount:
          type: integer
        returnedCount:
          type: integer
        limit:
          type: integer
        coverage:
          $ref: "#/components/schemas/MaritimeCoverage"
        providers:
          type: array
          items:
            $ref: "#/components/schemas/MaritimeProviderStatus"
        vessels:
          type: array
          items:
            $ref: "#/components/schemas/VesselRecord"
    MonitoringHazards:
      type: object
      required:
        - generatedAt
        - matchedCount
        - returnedCount
        - limit
        - coverage
        - sources
        - hazards
      properties:
        generatedAt:
          type: string
          format: date-time
        matchedCount:
          type: integer
        returnedCount:
          type: integer
        limit:
          type: integer
        coverage:
          $ref: "#/components/schemas/HazardCoverage"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/HazardSourceStatus"
        hazards:
          type: array
          items:
            $ref: "#/components/schemas/HazardRecord"
    HazardCoverage:
      type: object
      required:
        - scope
        - regions
        - note
      properties:
        scope:
          type: string
          enum: [global, regional, local]
          description: Derived from the sources that actually answered, never declared statically.
        regions:
          type: array
          items:
            type: string
        note:
          type: string
          description: >-
            Plain-language statement of what the coverage does and does not include,
            including detection thresholds such as the USGS magnitude 2.5 floor.
    HazardSourceStatus:
      type: object
      required:
        - id
        - name
        - attribution
        - licence
        - licenceUrl
        - catalogueUrl
        - status
        - coverage
        - hazardCount
        - checkedAt
        - message
      properties:
        id:
          type: string
        name:
          type: string
        attribution:
          type: string
          description: Attribution string the source asks for.
        licence:
          type: string
        licenceUrl:
          type: string
          format: uri
        catalogueUrl:
          type: string
          format: uri
        status:
          type: string
          enum: [available, unavailable]
          description: One source failing never removes the others.
        coverage:
          $ref: "#/components/schemas/HazardCoverage"
        hazardCount:
          type: integer
        checkedAt:
          type: string
          format: date-time
        message:
          type: string
    HazardRecord:
      type: object
      required:
        - id
        - source
        - hazardType
        - title
        - latitude
        - longitude
        - occurredAt
        - receivedAt
        - sourceUrl
        - attribution
        - licence
      properties:
        id:
          type: string
          description: Stable identity in the form "<source>:<provider record id>".
        source:
          type: string
        hazardType:
          type: string
          description: Hazard category exactly as the source classifies it. Never inferred from text.
        title:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        occurredAt:
          type: string
          format: date-time
          description: When the source says the hazard was observed. Never the fetch time.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the source last revised the record, where the source publishes it.
        receivedAt:
          type: string
          format: date-time
          description: When the Signalwatch API server received the record.
        activityStatus:
          type: string
          enum: [open, closed]
          nullable: true
          description: >-
            Source-declared activity state, present only where the source documents
            one (EONET "closed"). Null means the source makes no such claim.
        magnitudeValue:
          type: number
          nullable: true
        magnitudeUnit:
          type: string
          nullable: true
          description: >-
            The scale the magnitude is measured on. Magnitudes from different scales
            are never fused into a single severity number.
        magnitudeDescription:
          type: string
          nullable: true
        depthKm:
          type: number
          nullable: true
        reviewStatus:
          type: string
          nullable: true
          description: Provider review state, e.g. USGS "automatic" or "reviewed".
        place:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        sourceUrl:
          type: string
          format: uri
        attribution:
          type: string
        licence:
          type: string
    MaritimeCoverage:
      type: object
      required:
        - scope
        - regions
        - note
      properties:
        scope:
          type: string
          enum: [global, regional, local]
          description: Signalwatch maritime coverage is regional; it must not be presented as global.
        regions:
          type: array
          description: Human-readable regions the registered providers actually cover.
          items:
            type: string
        note:
          type: string
          description: Plain-language statement of what the coverage does and does not include.
    MaritimeProviderStatus:
      type: object
      required:
        - id
        - name
        - attribution
        - licence
        - licenceUrl
        - catalogueUrl
        - status
        - coverage
        - vesselCount
        - checkedAt
        - lastSuccessfulFetchAt
        - message
      properties:
        id:
          type: string
        name:
          type: string
        attribution:
          type: string
          description: Attribution string required by the provider licence.
        licence:
          type: string
          description: Licence short name, e.g. "CC BY 4.0" or "NLOD 2.0".
        licenceUrl:
          type: string
          format: uri
        catalogueUrl:
          type: string
          format: uri
        status:
          type: string
          enum: [available, stale, unavailable]
          description: Feed availability. One provider failing never removes the others.
        coverage:
          $ref: "#/components/schemas/MaritimeCoverage"
        vesselCount:
          type: integer
        checkedAt:
          type: string
          format: date-time
        lastSuccessfulFetchAt:
          type: ["string", "null"]
          format: date-time
        message:
          type: string
    VesselRecord:
      type: object
      description: >-
        One normalized vessel position. Optional AIS fields are null when the source
        did not supply them or supplied a documented not-available sentinel
        (course 360, speed 102.3/102.4, heading 511, IMO 0). Nothing is inferred.
      required:
        - id
        - provider
        - mmsi
        - imo
        - callSign
        - name
        - shipType
        - shipTypeLabel
        - latitude
        - longitude
        - courseOverGround
        - heading
        - speedOverGround
        - navigationalStatus
        - navigationalStatusLabel
        - destination
        - draughtMetres
        - positionTimestamp
        - receivedAt
        - sourceUrl
        - attribution
        - licence
      properties:
        id:
          type: string
          description: Stable identity, "<provider>:<mmsi>".
        provider:
          type: string
        mmsi:
          type: string
          description: Maritime Mobile Service Identity, as a string so leading zeros survive.
        imo:
          type: ["string", "null"]
          description: IMO number when supplied; null when the source reported 0 or omitted it.
        callSign:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
        shipType:
          type: ["integer", "null"]
          description: Raw AIS ship type code as published by the provider. Not an assessment.
        shipTypeLabel:
          type: ["string", "null"]
          description: >-
            Label for the AIS ship-type code as the provider classifies it. Providers may
            coarsen these codes; the label is the source's classification, never an
            inference by Signalwatch.
        latitude:
          type: number
        longitude:
          type: number
        courseOverGround:
          type: ["number", "null"]
        heading:
          type: ["integer", "null"]
        speedOverGround:
          type: ["number", "null"]
          description: Speed over ground in knots.
        navigationalStatus:
          type: ["integer", "null"]
        navigationalStatusLabel:
          type: ["string", "null"]
        destination:
          type: ["string", "null"]
          description: Free text entered by the vessel's crew. Reported, not verified.
        draughtMetres:
          type: ["number", "null"]
        positionTimestamp:
          type: ["string", "null"]
          format: date-time
          description: >-
            When the provider says the position was reported. Null when the provider
            supplies no position time; it is never substituted with the receipt time.
        receivedAt:
          type: string
          format: date-time
          description: When the Signalwatch API server received this record from the provider.
        sourceUrl:
          type: string
          format: uri
        attribution:
          type: string
        licence:
          type: string
    CameraProviderStatus:
      type: object
      required:
        - id
        - name
        - attribution
        - catalogueUrl
        - status
        - feedReachability
        - cameraCount
        - checkedAt
        - lastSuccessfulFetchAt
        - message
      properties:
        id:
          type: string
        name:
          type: string
        attribution:
          type: string
        catalogueUrl:
          type: string
          format: uri
        status:
          type: string
          enum: [available, stale, unavailable]
          description: Catalogue availability. This is not a feed-reachability check.
        feedReachability:
          type: string
          enum: [not-probed]
          description: Signalwatch never probes or proxies individual camera feeds.
        cameraCount:
          type: integer
        checkedAt:
          type: string
          format: date-time
        lastSuccessfulFetchAt:
          type: ["string", "null"]
          format: date-time
        message:
          type: string
    CameraRecord:
      type: object
      required:
        - id
        - provider
        - displayName
        - description
        - country
        - countryCode
        - region
        - subregion
        - latitude
        - longitude
        - direction
        - sourceUrl
        - encoding
        - format
        - imageUpdateRateMs
        - streamKind
        - feedStatus
        - publicAccess
        - attribution
        - catalogueUrl
      properties:
        id:
          type: string
        provider:
          type: string
        displayName:
          type: string
        description:
          type: ["string", "null"]
        country:
          type: string
        countryCode:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        subregion:
          type: ["string", "null"]
        district:
          type: ["string", "null"]
        locality:
          type: ["string", "null"]
        postcode:
          type: ["string", "null"]
        latitude:
          type: number
        longitude:
          type: number
        direction:
          type: ["string", "null"]
        sourceUrl:
          type: string
          format: uri
        encoding:
          type: ["string", "null"]
        format:
          type: ["string", "null"]
        imageUpdateRateMs:
          type: ["integer", "null"]
        streamKind:
          type: string
          enum: [snapshot, image, video, unknown]
        feedStatus:
          type: string
          enum: [not-probed]
          description: Catalogue listing only; the feed itself is never contacted.
        publicAccess:
          type: string
          enum: [catalogue-listed]
        attribution:
          type: string
        catalogueUrl:
          type: string
          format: uri
    MonitoringHeadline:
      type: object
      required:
        - id
        - title
        - source
        - url
        - publishedAt
        - language
      properties:
        id:
          type: string
        title:
          type: string
        source:
          type: string
        url:
          type: string
          format: uri
        publishedAt:
          type: string
          format: date-time
        language:
          type: string
        imageUrl:
          type: ["string", "null"]
          format: uri
        summary:
          type: ["string", "null"]
    MonitoringEvent:
      type: object
      required:
        - id
        - title
        - category
        - source
        - sourceKind
        - url
        - occurredAt
        - latitude
        - longitude
        - magnitude
      properties:
        id:
          type: string
        sourceKind:
          type: string
          enum: [hazard, news]
          description: >-
            Explicit provenance of the feed this record came from, set where the
            record is created. "hazard" records come from hazard-oriented data
            sources and are rendered by the natural-hazards layer; "news" records
            come from general public reporting. Layer routing reads this field
            rather than pattern-matching record ids or titles.
        title:
          type: string
        category:
          type: string
        source:
          type: string
        url:
          type: string
          format: uri
        occurredAt:
          type: string
          format: date-time
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        magnitude:
          type: ["number", "null"]
        detail:
          type: ["string", "null"]
    MonitoringSource:
      type: object
      required:
        - id
        - name
        - category
        - attribution
        - url
        - status
        - itemsReceived
        - checkedAt
        - message
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        attribution:
          type: string
        url:
          type: string
          format: uri
        status:
          type: string
          enum: [online, unavailable, configured, provider-needed, not-integrated]
        itemsReceived:
          type: integer
        checkedAt:
          type: string
          format: date-time
        message:
          type: string

