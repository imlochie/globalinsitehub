openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: monitoring
    description: Public news and global event monitoring
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /monitoring/briefing:
    get:
      operationId: getMonitoringBriefing
      tags: [monitoring]
      summary: Get the current public-source monitoring briefing
      description: Returns recent headlines, geolocated public events, and source availability from public feeds.
      parameters:
        - name: q
          in: query
          required: false
          description: Optional text filter applied to headlines and events.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of headlines and events to return.
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 40
      responses:
        "200":
          description: Current monitoring briefing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringBriefing"
  /monitoring/cameras:
    get:
      operationId: getMonitoringCameras
      tags: [monitoring]
      summary: List public camera catalogue records
      description: >-
        Returns bounded public camera catalogue records and per-provider catalogue
        health. Individual camera feeds are never probed or proxied; feedStatus and
        feedReachability are always "not-probed".
      parameters:
        - name: q
          in: query
          required: false
          description: Optional text filter applied to catalogue metadata.
          schema:
            type: string
        - name: country
          in: query
          required: false
          description: Country name or ISO-3166 alpha-2 code filter.
          schema:
            type: string
        - name: provider
          in: query
          required: false
          description: Provider id filter, e.g. qld-tmr.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of camera records to return.
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 100
      responses:
        "200":
          description: Bounded camera catalogue records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringCameras"
  /monitoring/maritime:
    get:
      operationId: getMonitoringMaritime
      tags: [monitoring]
      summary: List vessel positions from free, openly licensed regional AIS sources
      description: >-
        Returns bounded vessel positions aggregated server-side from openly licensed
        regional AIS providers, plus per-provider health and explicit coverage
        metadata. Coverage is REGIONAL, not global: absence of vessels outside the
        declared regions means Signalwatch has no maritime source there, not that no
        vessels are present. Every record carries the provider that supplied it, the
        provider licence, and both the provider position timestamp (when supplied) and
        the Signalwatch receipt time; the two are never conflated.
      parameters:
        - name: q
          in: query
          required: false
          description: Optional text filter applied to vessel name, callsign, MMSI, IMO and destination.
          schema:
            type: string
        - name: provider
          in: query
          required: false
          description: Provider id filter, e.g. digitraffic.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of vessel records to return.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 400
      responses:
        "200":
          description: Bounded vessel positions with coverage and provider health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringVessels"
  /monitoring/hazards:
    get:
      operationId: getMonitoringHazards
      tags: [monitoring]
      summary: List natural hazard observations from free, openly licensed hazard sources
      description: >-
        Returns bounded natural hazard observations aggregated server-side from
        hazard-oriented public data sources (USGS earthquakes, NASA EONET events),
        plus per-source health, licensing and explicit coverage metadata. Records are
        structured observations published by hazard sources; nothing here is derived
        from news headlines, and a hazard type is never inferred from wording. The
        source observation time and the Signalwatch receipt time are always kept
        distinct. One source failing marks that source unavailable and never empties
        the layer. Upstream feeds are shared with the briefing route, so this endpoint
        adds no additional polling of the providers.
      parameters:
        - name: q
          in: query
          required: false
          description: Optional text filter applied to hazard title, type, place and source.
          schema:
            type: string
        - name: source
          in: query
          required: false
          description: Source id filter, e.g. usgs or nasa-eonet.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of hazard records to return.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 250
      responses:
        "200":
          description: Bounded hazard observations with coverage and source health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringHazards"
  /monitoring/public-events:
    get:
      operationId: getMonitoringPublicEvents
      tags: [monitoring]
      summary: List geolocated civic incidents from free, openly licensed authority feeds
      description: >-
        Returns bounded civic incident records aggregated server-side from state road
        authority open-data feeds, plus per-provider health, licensing and explicit
        coverage metadata. Records are geolocated civic reporting: incidents, crashes,
        closures, roadworks, flooding-affected roads and major events. Categories are
        always the category the source assigned and are never inferred from wording, so
        a road closed by flooding stays a civic incident and is not reclassified as a
        natural hazard. Coverage is REGIONAL. A provider that is unavailable or
        unconfigured is reported as such and never suppresses the others.
      parameters:
        - name: q
          in: query
          required: false
          description: Optional text filter applied to title, event type, road and locality.
          schema:
            type: string
        - name: provider
          in: query
          required: false
          description: Provider id filter, e.g. qldtraffic or tfnsw.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of civic incident records to return.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 400
      responses:
        "200":
          description: Bounded civic incidents with coverage and provider health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringPublicEvents"
  /monitoring/weather:
    get:
      operationId: getMonitoringWeather
      tags: [monitoring]
      summary: Describe the weather spatial products available for rendering
      description: >-
        Returns the continuous spatial surfaces Signalwatch can render for the weather
        layer, with provenance, coverage, freshness and provider health. This endpoint
        returns PRODUCTS, not observations: a radar mosaic is a surface covering
        millions of square kilometres with no record id and no single coordinate, so it
        is deliberately not expressed as a point observation. There is no limit or text
        filter because there is nothing to paginate or search. Signalwatch serves only
        the metadata; the imagery itself is requested by the browser directly from the
        provider, exactly as camera media is, and is never relayed through this server.
        Coverage is REGIONAL and explicitly bounded: outside the declared bounds there
        is no source, which is never the same claim as "no precipitation".
      responses:
        "200":
          description: Weather spatial products with coverage, freshness and health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringWeather"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MonitoringBriefing:
      type: object
      required:
        - generatedAt
        - headlineCount
        - eventCount
        - sourcesOnline
        - headlines
        - events
        - sources
      properties:
        generatedAt:
          type: string
          format: date-time
        headlineCount:
          type: integer
        eventCount:
          type: integer
        sourcesOnline:
          type: integer
        headlines:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringHeadline"
        events:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringEvent"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringSource"
    MonitoringCameras:
      type: object
      required:
        - generatedAt
        - matchedCount
        - returnedCount
        - limit
        - providers
        - cameras
      properties:
        generatedAt:
          type: string
          format: date-time
        matchedCount:
          type: integer
        returnedCount:
          type: integer
        limit:
          type: integer
        providers:
          type: array
          items:
            $ref: "#/components/schemas/CameraProviderStatus"
        cameras:
          type: array
          items:
            $ref: "#/components/schemas/CameraRecord"
    MonitoringVessels:
      type: object
      required:
        - generatedAt
        - matchedCount
        - returnedCount
        - limit
        - coverage
        - providers
        - vessels
      properties:
        generatedAt:
          type: string
          format: date-time
        matchedCount:
          type: integer
        returnedCount:
          type: integer
        limit:
          type: integer
        coverage:
          $ref: "#/components/schemas/MaritimeCoverage"
        providers:
          type: array
          items:
            $ref: "#/components/schemas/MaritimeProviderStatus"
        vessels:
          type: array
          items:
            $ref: "#/components/schemas/VesselRecord"
    MonitoringHazards:
      type: object
      required:
        - generatedAt
        - matchedCount
        - returnedCount
        - limit
        - coverage
        - sources
        - hazards
      properties:
        generatedAt:
          type: string
          format: date-time
        matchedCount:
          type: integer
        returnedCount:
          type: integer
        limit:
          type: integer
        coverage:
          $ref: "#/components/schemas/HazardCoverage"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/HazardSourceStatus"
        hazards:
          type: array
          items:
            $ref: "#/components/schemas/HazardRecord"
    HazardCoverage:
      type: object
      required:
        - scope
        - regions
        - note
      properties:
        scope:
          type: string
          enum: [global, regional, local]
          description: Derived from the sources that actually answered, never declared statically.
        regions:
          type: array
          items:
            type: string
        note:
          type: string
          description: >-
            Plain-language statement of what the coverage does and does not include,
            including detection thresholds such as the USGS magnitude 2.5 floor.
    HazardSourceStatus:
      type: object
      required:
        - id
        - name
        - attribution
        - licence
        - licenceUrl
        - catalogueUrl
        - status
        - coverage
        - hazardCount
        - checkedAt
        - message
      properties:
        id:
          type: string
        name:
          type: string
        attribution:
          type: string
          description: Attribution string the source asks for.
        licence:
          type: string
        licenceUrl:
          type: string
          format: uri
        catalogueUrl:
          type: string
          format: uri
        status:
          type: string
          enum: [available, unavailable]
          description: One source failing never removes the others.
        coverage:
          $ref: "#/components/schemas/HazardCoverage"
        hazardCount:
          type: integer
        checkedAt:
          type: string
          format: date-time
        message:
          type: string
    HazardRecord:
      type: object
      required:
        - id
        - source
        - hazardType
        - title
        - latitude
        - longitude
        - occurredAt
        - receivedAt
        - sourceUrl
        - attribution
        - licence
      properties:
        id:
          type: string
          description: Stable identity in the form "<source>:<provider record id>".
        source:
          type: string
        hazardType:
          type: string
          description: Hazard category exactly as the source classifies it. Never inferred from text.
        title:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        occurredAt:
          type: string
          format: date-time
          description: When the source says the hazard was observed. Never the fetch time.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the source last revised the record, where the source publishes it.
        receivedAt:
          type: string
          format: date-time
          description: When the Signalwatch API server received the record.
        activityStatus:
          type: string
          enum: [open, closed]
          nullable: true
          description: >-
            Source-declared activity state, present only where the source documents
            one (EONET "closed"). Null means the source makes no such claim.
        magnitudeValue:
          type: number
          nullable: true
        magnitudeUnit:
          type: string
          nullable: true
          description: >-
            The scale the magnitude is measured on. Magnitudes from different scales
            are never fused into a single severity number.
        magnitudeDescription:
          type: string
          nullable: true
        depthKm:
          type: number
          nullable: true
        reviewStatus:
          type: string
          nullable: true
          description: Provider review state, e.g. USGS "automatic" or "reviewed".
        sourceSeverity:
          type: string
          nullable: true
          description: >-
            The source's own severity label, e.g. the NWS CAP severity
            ("Extreme", "Severe", "Moderate", "Minor"). Carried verbatim and
            never ranked, scored, or compared against another source's scale.
        place:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        sourceUrl:
          type: string
          format: uri
        attribution:
          type: string
        licence:
          type: string
    MaritimeCoverage:
      type: object
      required:
        - scope
        - regions
        - note
      properties:
        scope:
          type: string
          enum: [global, regional, local]
          description: Signalwatch maritime coverage is regional; it must not be presented as global.
        regions:
          type: array
          description: Human-readable regions the registered providers actually cover.
          items:
            type: string
        note:
          type: string
          description: Plain-language statement of what the coverage does and does not include.
    MaritimeProviderStatus:
      type: object
      required:
        - id
        - name
        - attribution
        - licence
        - licenceUrl
        - catalogueUrl
        - status
        - coverage
        - vesselCount
        - checkedAt
        - lastSuccessfulFetchAt
        - message
      properties:
        id:
          type: string
        name:
          type: string
        attribution:
          type: string
          description: Attribution string required by the provider licence.
        licence:
          type: string
          description: Licence short name, e.g. "CC BY 4.0" or "NLOD 2.0".
        licenceUrl:
          type: string
          format: uri
        catalogueUrl:
          type: string
          format: uri
        status:
          type: string
          enum: [available, stale, unavailable]
          description: Feed availability. One provider failing never removes the others.
        coverage:
          $ref: "#/components/schemas/MaritimeCoverage"
        vesselCount:
          type: integer
        checkedAt:
          type: string
          format: date-time
        lastSuccessfulFetchAt:
          type: ["string", "null"]
          format: date-time
        message:
          type: string
    VesselRecord:
      type: object
      description: >-
        One normalized vessel position. Optional AIS fields are null when the source
        did not supply them or supplied a documented not-available sentinel
        (course 360, speed 102.3/102.4, heading 511, IMO 0). Nothing is inferred.
      required:
        - id
        - provider
        - mmsi
        - imo
        - callSign
        - name
        - shipType
        - shipTypeLabel
        - latitude
        - longitude
        - courseOverGround
        - heading
        - speedOverGround
        - navigationalStatus
        - navigationalStatusLabel
        - destination
        - draughtMetres
        - positionTimestamp
        - receivedAt
        - sourceUrl
        - attribution
        - licence
      properties:
        id:
          type: string
          description: Stable identity, "<provider>:<mmsi>".
        provider:
          type: string
        mmsi:
          type: string
          description: Maritime Mobile Service Identity, as a string so leading zeros survive.
        imo:
          type: ["string", "null"]
          description: IMO number when supplied; null when the source reported 0 or omitted it.
        callSign:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
        shipType:
          type: ["integer", "null"]
          description: Raw AIS ship type code as published by the provider. Not an assessment.
        shipTypeLabel:
          type: ["string", "null"]
          description: >-
            Label for the AIS ship-type code as the provider classifies it. Providers may
            coarsen these codes; the label is the source's classification, never an
            inference by Signalwatch.
        latitude:
          type: number
        longitude:
          type: number
        courseOverGround:
          type: ["number", "null"]
        heading:
          type: ["integer", "null"]
        speedOverGround:
          type: ["number", "null"]
          description: Speed over ground in knots.
        navigationalStatus:
          type: ["integer", "null"]
        navigationalStatusLabel:
          type: ["string", "null"]
        destination:
          type: ["string", "null"]
          description: Free text entered by the vessel's crew. Reported, not verified.
        draughtMetres:
          type: ["number", "null"]
        positionTimestamp:
          type: ["string", "null"]
          format: date-time
          description: >-
            When the provider says the position was reported. Null when the provider
            supplies no position time; it is never substituted with the receipt time.
        receivedAt:
          type: string
          format: date-time
          description: When the Signalwatch API server received this record from the provider.
        sourceUrl:
          type: string
          format: uri
        attribution:
          type: string
        licence:
          type: string
    CameraProviderStatus:
      type: object
      required:
        - id
        - name
        - attribution
        - catalogueUrl
        - status
        - feedReachability
        - cameraCount
        - checkedAt
        - lastSuccessfulFetchAt
        - message
      properties:
        id:
          type: string
        name:
          type: string
        attribution:
          type: string
        catalogueUrl:
          type: string
          format: uri
        status:
          type: string
          enum: [available, stale, unavailable]
          description: Catalogue availability. This is not a feed-reachability check.
        feedReachability:
          type: string
          enum: [not-probed]
          description: Signalwatch never probes or proxies individual camera feeds.
        cameraCount:
          type: integer
        checkedAt:
          type: string
          format: date-time
        lastSuccessfulFetchAt:
          type: ["string", "null"]
          format: date-time
        message:
          type: string
    CameraRecord:
      type: object
      required:
        - id
        - provider
        - displayName
        - description
        - country
        - countryCode
        - region
        - subregion
        - latitude
        - longitude
        - direction
        - sourceUrl
        - encoding
        - format
        - imageUpdateRateMs
        - streamKind
        - viewCapability
        - feedStatus
        - publicAccess
        - attribution
        - catalogueUrl
      properties:
        id:
          type: string
        provider:
          type: string
        displayName:
          type: string
        description:
          type: ["string", "null"]
        country:
          type: string
        countryCode:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        subregion:
          type: ["string", "null"]
        district:
          type: ["string", "null"]
        locality:
          type: ["string", "null"]
        postcode:
          type: ["string", "null"]
        latitude:
          type: number
        longitude:
          type: number
        direction:
          type: ["string", "null"]
        sourceUrl:
          type: string
          format: uri
        encoding:
          type: ["string", "null"]
        format:
          type: ["string", "null"]
        imageUpdateRateMs:
          type: ["integer", "null"]
        streamKind:
          type: string
          enum: [snapshot, image, video, unknown]
        feedStatus:
          type: string
          enum: [not-probed]
          description: Catalogue listing only; the feed itself is never contacted.
        viewCapability:
          type: string
          enum: [catalogue-only, live-image, video-stream, external-viewer, unavailable]
          description: >-
            What Signalwatch can actually offer for this camera, derived only from
            what the provider documents. "live-image" means the provider publishes a
            current still image URL; "video-stream" means a genuinely playable public
            media URL; "external-viewer" means the provider owns the viewing page;
            "catalogue-only" means the location is listed but no public viewing
            mechanism is published. A camera is never called a stream merely because
            it has a source web page.
        mediaUrl:
          type: ["string", "null"]
          format: uri
          description: >-
            Direct public media URL, present only when the provider documents one.
            Never inferred or constructed.
        mediaType:
          type: ["string", "null"]
          enum: [image, mjpeg, hls, webpage, null]
          description: Media kind of mediaUrl, as documented by the provider.
        viewUrl:
          type: ["string", "null"]
          format: uri
          description: Provider-owned page for viewing this camera, where one exists.
        publicAccess:
          type: string
          enum: [catalogue-listed]
        attribution:
          type: string
        catalogueUrl:
          type: string
          format: uri
    MonitoringHeadline:
      type: object
      required:
        - id
        - title
        - source
        - url
        - publishedAt
        - language
      properties:
        id:
          type: string
        title:
          type: string
        source:
          type: string
        url:
          type: string
          format: uri
        publishedAt:
          type: string
          format: date-time
        language:
          type: string
        imageUrl:
          type: ["string", "null"]
          format: uri
        summary:
          type: ["string", "null"]
    MonitoringPublicEvents:
      type: object
      required:
        - generatedAt
        - matchedCount
        - returnedCount
        - limit
        - coverage
        - providers
        - events
      properties:
        generatedAt:
          type: string
          format: date-time
        matchedCount:
          type: integer
        returnedCount:
          type: integer
        limit:
          type: integer
        coverage:
          $ref: "#/components/schemas/PublicEventCoverage"
        providers:
          type: array
          items:
            $ref: "#/components/schemas/PublicEventProviderStatus"
        events:
          type: array
          items:
            $ref: "#/components/schemas/PublicEventRecord"
    PublicEventCoverage:
      type: object
      required:
        - scope
        - regions
        - note
      properties:
        scope:
          type: string
          enum: [global, regional, local]
          description: Derived from the providers actually supplying data. Never global.
        regions:
          type: array
          items:
            type: string
        note:
          type: string
    PublicEventProviderStatus:
      type: object
      required:
        - id
        - name
        - attribution
        - licence
        - licenceUrl
        - catalogueUrl
        - status
        - coverage
        - eventCount
        - checkedAt
        - message
      properties:
        id:
          type: string
        name:
          type: string
        attribution:
          type: string
        licence:
          type: string
        licenceUrl:
          type: string
          format: uri
        catalogueUrl:
          type: string
          format: uri
        status:
          type: string
          enum: [available, unavailable, unconfigured]
          description: >-
            "unconfigured" means the provider needs a credential Signalwatch does not
            have. It is a configuration state, not a failure, and never suppresses the
            other providers.
        coverage:
          $ref: "#/components/schemas/PublicEventCoverage"
        eventCount:
          type: integer
        checkedAt:
          type: string
          format: date-time
        message:
          type: string
    PublicEventImpact:
      type: ["object", "null"]
      description: Present only when the source publishes impact details.
      properties:
        direction:
          type: string
          nullable: true
        towards:
          type: string
          nullable: true
        impactType:
          type: string
          nullable: true
        impactSubtype:
          type: string
          nullable: true
        delay:
          type: string
          nullable: true
    PublicEventRoadSummary:
      type: ["object", "null"]
      description: Present only when the source publishes road details.
      properties:
        roadName:
          type: string
          nullable: true
        locality:
          type: string
          nullable: true
        postcode:
          type: string
          nullable: true
        localGovernmentArea:
          type: string
          nullable: true
        district:
          type: string
          nullable: true
    PublicEventRecord:
      type: object
      required:
        - id
        - provider
        - eventType
        - title
        - latitude
        - longitude
        - locationDerived
        - receivedAt
        - sourceUrl
        - attribution
        - licence
      properties:
        id:
          type: string
          description: Stable identity in the form "<provider>:<provider record id>".
        provider:
          type: string
        eventType:
          type: string
          description: Category exactly as the source classifies it. Never inferred from text.
        eventSubtype:
          type: string
          nullable: true
        eventDueTo:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        advice:
          type: string
          nullable: true
        latitude:
          type: number
        longitude:
          type: number
        locationDerived:
          type: boolean
          description: >-
            True when the coordinate was averaged from a multi-segment geometry rather
            than published as a single point. Such markers are representative
            locations, not surveyed coordinates.
        locationNote:
          type: string
          nullable: true
        sourcePriority:
          type: string
          nullable: true
          description: >-
            The source's own priority label. It is not a severity score, is never
            numeric, and is never compared across providers or against hazard
            magnitudes.
        status:
          type: string
          nullable: true
        impact:
          $ref: "#/components/schemas/PublicEventImpact"
        roadSummary:
          $ref: "#/components/schemas/PublicEventRoadSummary"
        publishedAt:
          type: string
          format: date-time
          nullable: true
        lastUpdatedAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        receivedAt:
          type: string
          format: date-time
          description: When the Signalwatch API server received the record.
        sourceUrl:
          type: string
          format: uri
        suppliedBy:
          type: string
          nullable: true
          description: The body that originally supplied the record, where it differs from the provider.
        attribution:
          type: string
        licence:
          type: string
    MonitoringEvent:
      type: object
      required:
        - id
        - title
        - category
        - source
        - sourceKind
        - url
        - occurredAt
        - latitude
        - longitude
        - magnitude
      properties:
        id:
          type: string
        sourceKind:
          type: string
          enum: [hazard, news]
          description: >-
            Explicit provenance of the feed this record came from, set where the
            record is created. "hazard" records come from hazard-oriented data
            sources and are rendered by the natural-hazards layer; "news" records
            come from general public reporting. Layer routing reads this field
            rather than pattern-matching record ids or titles.
        title:
          type: string
        category:
          type: string
        source:
          type: string
        url:
          type: string
          format: uri
        occurredAt:
          type: string
          format: date-time
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        magnitude:
          type: ["number", "null"]
        detail:
          type: ["string", "null"]
    MonitoringSource:
      type: object
      required:
        - id
        - name
        - category
        - attribution
        - url
        - status
        - itemsReceived
        - checkedAt
        - message
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        attribution:
          type: string
        url:
          type: string
          format: uri
        status:
          type: string
          enum: [online, unavailable, configured, provider-needed, not-integrated]
        itemsReceived:
          type: integer
        checkedAt:
          type: string
          format: date-time
        message:
          type: string

    MonitoringWeather:
      type: object
      required:
        - generatedAt
        - coverage
        - products
      properties:
        generatedAt:
          type: string
          format: date-time
          description: When this response was assembled. Never a product's own time.
        coverage:
          $ref: "#/components/schemas/SpatialCoverage"
        products:
          type: array
          items:
            $ref: "#/components/schemas/SpatialProduct"
    SpatialBounds:
      type: object
      description: A named geographic extent in EPSG:4326 degrees.
      required:
        - name
        - west
        - south
        - east
        - north
      properties:
        name:
          type: string
          description: Region name, so a clip box is never an unattributed number.
        west:
          type: number
        south:
          type: number
        east:
          type: number
        north:
          type: number
    SpatialCoverage:
      type: object
      required:
        - scope
        - regions
        - note
        - areas
      properties:
        scope:
          type: string
          enum: [global, regional, local]
          description: Derived from the products that answered, never declared statically.
        regions:
          type: array
          items:
            type: string
        note:
          type: string
          description: >-
            Plain-language statement of what is and is not observed. Outside the
            declared coverage there is no source; that is never reported as an
            absence of weather.
        areas:
          type: array
          items:
            $ref: "#/components/schemas/SpatialBounds"
          description: >-
            Areas the product actually observes, as disjoint boxes. An empty list
            means global. A list rather than a single box because a single
            min/max envelope over disjoint regions over-claims badly: NOAA's radar
            service spans Guam and the Caribbean, so its published envelope sweeps
            in Europe, Africa and Asia, where transparent tiles would be
            indistinguishable from "no precipitation".
    SpatialImageryService:
      type: object
      description: >-
        How a raster surface is rendered. The browser requests tiles from this
        endpoint directly; Signalwatch does not proxy provider imagery.
      required:
        - protocol
        - endpoint
        - layer
        - version
        - crs
        - supportedCrs
        - format
        - transparent
        - timeParameter
        - opacity
      properties:
        protocol:
          type: string
          enum: [wms]
        endpoint:
          type: string
          format: uri
        layer:
          type: string
        version:
          type: string
        crs:
          type: string
          description: >-
            Requested CRS. EPSG:3857 is used deliberately because WMS 1.3.0
            reverses axis order for EPSG:4326.
        supportedCrs:
          type: array
          items:
            type: string
          description: >-
            Every CRS the service advertises in its own GetCapabilities. `crs`
            above is what the 2D map requests; this is what the provider is
            documented to support. They are different questions, and a renderer
            needing a different projection - the globe needs an equirectangular
            one - must check this rather than assume. An empty list means "not
            established from provider documentation", and a renderer must then
            draw nothing rather than guess.
        format:
          type: string
        transparent:
          type: boolean
        timeParameter:
          type: ["string", "null"]
          description: >-
            Name of the time parameter when the service is time-enabled. Omitting
            the parameter asks the provider for its most recent frame.
        opacity:
          type: number
    SpatialFieldDescriptor:
      type: object
      description: >-
        Gridded numeric field. Declared for the next batch; no field provider is
        implemented and no GRIB decoding happens anywhere in this codebase.
      required:
        - variable
        - unit
        - grid
        - resolutionDegrees
        - valueRange
        - missingValue
        - modelId
        - runId
      properties:
        variable:
          type: string
        unit:
          type: string
          description: Unit as the provider publishes it. Never converted silently.
        grid:
          type: object
          required:
            - width
            - height
          properties:
            width:
              type: integer
            height:
              type: integer
        resolutionDegrees:
          type: number
        valueRange:
          oneOf:
            - type: object
              required:
                - min
                - max
              properties:
                min:
                  type: number
                max:
                  type: number
            - type: "null"
        missingValue:
          type: ["number", "null"]
          description: How the provider encodes "no data". Never confused with zero.
        modelId:
          type: ["string", "null"]
        runId:
          type: ["string", "null"]
    SpatialProduct:
      type: object
      description: >-
        A continuous spatial surface. The three timestamps are kept separate on
        purpose: collapsing them would make a forecast indistinguishable from an
        observation.
      required:
        - id
        - layerId
        - kind
        - providerId
        - providerName
        - productName
        - productDescription
        - attribution
        - sourceUrl
        - licence
        - coverage
        - sourceTimestamp
        - ingestionTimestamp
        - validTime
        - runTime
        - refreshIntervalMs
        - staleAfterMs
        - availability
        - message
        - imagery
        - field
      properties:
        id:
          type: string
        layerId:
          type: string
        kind:
          type: string
          enum: [imagery, field]
        providerId:
          type: string
        providerName:
          type: string
        productName:
          type: string
        productDescription:
          type: string
        attribution:
          type: string
        sourceUrl:
          type: string
          format: uri
        licence:
          type: string
        coverage:
          $ref: "#/components/schemas/SpatialCoverage"
        sourceTimestamp:
          type: ["string", "null"]
          format: date-time
          description: When the provider says the content is valid. Null when not published.
        ingestionTimestamp:
          type: string
          format: date-time
          description: When Signalwatch retrieved it. Never the source time.
        validTime:
          type: ["string", "null"]
          format: date-time
          description: Model valid time. Null for observations such as radar.
        runTime:
          type: ["string", "null"]
          format: date-time
          description: Model run/reference time. Null for observations.
        refreshIntervalMs:
          type: integer
          description: Documented provider cadence. Clients must not poll faster.
        staleAfterMs:
          type: integer
        availability:
          type: string
          enum: [covered, stale, unavailable, unconfigured]
        message:
          type: string
        imagery:
          oneOf:
            - $ref: "#/components/schemas/SpatialImageryService"
            - type: "null"
        field:
          oneOf:
            - $ref: "#/components/schemas/SpatialFieldDescriptor"
            - type: "null"
